---
  - summary: |
      Поиск товара по существующему ключевому слову
    requirement: |
      Пользователь должен иметь возможность искать товары по ключевому слову или категории
    prerequisites:
      - Открыта главная страница интернет-магазина
    test-data: |
      Поисковый запрос = Apple
    steps:
      - Нажать на поле поиска
      - Ввести ключевое слово из тестовых данных
      - Запустить поиск (нажать Enter или кнопку поиска)
    expected-result: |
      В результатах поиска отображаются только товары, соответствующие введенному ключевому слову

  - summary: |
      Выбор товаров по категории
    requirement: |
      Пользователь должен иметь возможность искать товары по категории
    prerequisites:
      - Открыта главная страница интернет-магазина
    test-data: |
      Категория = beauty
    steps:
      - Открыть список категорий
      - Выбрать категорию из тестовых данных
    expected-result: |
      На странице отображаются только товары, относящиеся к выбранной категории

  - summary: |
      Фильтрация товаров по параметрам
    requirement: |
      Пользователь должен иметь возможность фильтровать товары
    prerequisites:
      - Открыта страница каталога товаров
    test-data: |
      Параметр фильтра = Бренды
    steps:
      - Выбрать значение в блоке фильтров из тестовых данных
      - Применить фильтр (если требуется)
    expected-result: |
      Список товаров обновился, отображаются только позиции, подходящие под выбранный фильтр

  - summary: |
      Сброс примененных фильтров
    requirement: |
      Неявное требование: возможность сбросить примененные фильтры
    prerequisites:
      - Открыта страница каталога с уже примененными фильтрами
    test-data: |
      Не требуются
    steps:
      - Снять выбранные фильтры (или нажать на кнопку сброса фильтров)
    expected-result: |
      Фильтры очищены, в каталоге снова отображается полный список товаров

  - summary: |
      Просмотр подробной информации о товаре
    requirement: |
      Пользователь должен иметь возможность просматривать товары и просматривать подробную информацию о товаре
    prerequisites:
      - Открыта страница каталога товаров
    test-data: |
      Товар = Essence Mascara Lash Princess
    steps:
      - Нажать на карточку или название выбранного товара
    expected-result: |
      Открывается страница товара с подробным описанием, ценой, характеристиками и изображением

  - summary: |
      Добавление товара в корзину
    requirement: |
      Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
    prerequisites:
      - Открыта страница каталога или карточка товара
      - Корзина пуста
    test-data: |
      Товар = Calvin Klein CK One
    steps:
      - Нажать кнопку «Добавить в корзину» у выбранного товара
      - Перейти в раздел «Корзина»
    expected-result: |
      Выбранный товар отображается в корзине с корректным названием, ценой и количеством

  - summary: |
      Просмотр пустой корзины
    requirement: |
      Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
    prerequisites:
      - Открыта главная страница интернет-магазина
      - В корзину не добавлено ни одного товара
    test-data: |
      Не требуются
    steps:
      - Нажать на иконку или ссылку «Корзина»
    expected-result: |
      Открывается страница корзины, отображается сообщение о том, что корзина пуста

  - summary: |
      Изменение количества товара в корзине
    requirement: |
      Неявное требование: возможность изменять количество товаров в корзине и автоматический пересчет суммы
    prerequisites:
      - В корзину добавлен 1 товар
      - Открыта страница корзины
    test-data: |
      Новое количество = 2
    steps:
      - Нажать кнопку увеличения количества товара («+»)
    expected-result: |
      Количество товара увеличилось до 2, итоговая стоимость заказа автоматически пересчиталась

  - summary: |
      Удаление товара из корзины
    requirement: |
      Неявное требование: возможность удалять товары из корзины
    prerequisites:
      - В корзину добавлен товар
      - Открыта страница корзины
    test-data: |
      Не требуются
    steps:
      - Нажать кнопку удаления товара из корзины
    expected-result: |
      Товар удален из списка, общая сумма заказа обновилась (или отображается сообщение о пустой корзине)

  - summary: |
      Оформление заказа из корзины
    requirement: |
      Неявное требование: возможность оформить заказ из корзины
    prerequisites:
      - В корзину добавлен хотя бы один товар
      - Открыта страница корзины
    test-data: |
      Данные покупателя = Валидные имя, телефон и адрес (в соответствии с полями формы)
    steps:
      - Нажать кнопку оформления заказа
      - Заполнить обязательные поля формы валидными данными
      - Подтвердить оформление заказа
    expected-result: |
      Заказ успешно оформлен, отображается уведомление о принятии заказа

  - summary: |
      Оформление заказа с пустыми обязательными полями
    requirement: |
      Неявное требование: валидация данных при оформлении заказа
    prerequisites:
      - В корзину добавлен товар
      - Открыта форма оформления заказа
    test-data: |
      Данные покупателя = Пустые поля
    steps:
      - Оставить обязательные поля пустыми
      - Нажать кнопку подтверждения заказа
    expected-result: |
      Заказ не оформляется, под незаполненными обязательными полями появляются сообщения об ошибке

  - summary: |
      Переключение языка интерфейса с русского на английский
    requirement: |
      Пользователь должен иметь возможность переключить язык интерфейса
    prerequisites:
      - Открыта главная страница интернет-магазина на русском языке
    test-data: |
      Язык = English
    steps:
      - Нажать на переключатель языка в шапке сайта
      - Выбрать английский язык
    expected-result: |
      Элементы навигации, кнопки и тексты интерфейса переведены на английский язык без поломки верстки

  - summary: |
      Переключение языка интерфейса с английского на русский
    requirement: |
      Пользователь должен иметь возможность переключить язык интерфейса
    prerequisites:
      - Открыта главная страница интернет-магазина на английском языке
    test-data: |
      Язык = Русский
    steps:
      - Нажать на переключатель языка в шапке сайта
      - Выбрать русский язык
    expected-result: |
      Элементы навигации, кнопки и тексты интерфейса переведены на русский язык без поломки верстки

- summary: |
      Переключение языка интерфейса с русского на испанский
    requirement: |
      Пользователь должен иметь возможность переключить язык интерфейса
    prerequisites:
      - Открыта главная страница интернет-магазина на русском языке
    test-data: |
      Язык = Spanish
    steps:
      - Нажать на переключатель языка в шапке сайта
      - Выбрать английский язык
    expected-result: |
      Элементы навигации, кнопки и тексты интерфейса переведены на английский язык без поломки верстки

- summary: |
      Переключение языка интерфейса с английского на испанский
    requirement: |
      Пользователь должен иметь возможность переключить язык интерфейса
    prerequisites:
      - Открыта главная страница интернет-магазина на английском языке
    test-data: |
      Язык = Русский
    steps:
      - Нажать на переключатель языка в шапке сайта
      - Выбрать русский язык
    expected-result: |
      Элементы навигации, кнопки и тексты интерфейса переведены на русский язык без поломки верстки

  - summary: |
      Корректное отображение мобильной версии сайта
    requirement: |
      Сайт должен иметь мобильную версию / Сайт должен быть доступен на различных устройствах
    prerequisites:
      - Открыта главная страница интернет-магазина в браузере
    test-data: |
      Разрешение экрана = 393x852 (iPhone 16) или 360x800 (Samsung Galaxy A55)
    steps:
      - Открыть инструменты разработчика (DevTools) и включить режим эмуляции мобильного устройства
      - Установить разрешение экрана из тестовых данных и обновить страницу
      - Проверить отображение шапки, каталога товаров и корзины
    expected-result: |
      Верстка адаптировалась под узкий экран, отсутствует горизонтальная прокрутка, все кнопки и тексты читаемы и не наезжают друг на друга

  - summary: |
      Совместимость сайта с последними версиями браузеров
    requirement: |
      Сайт нужно протестировать на совместимость с последними версиями браузеров
    prerequisites:
      - На устройстве установлены актуальные версии Google Chrome
    test-data: |
      Браузеры = Chrome (последние релизные версии)
    steps:
      - Открыть главную страницу интернет-магазина в каждом из браузеров из тестовых данных
      - Выполнить базовый сценарий: поиск товара, открытие карточки и добавление в корзину
    expected-result: |
      Во всех проверенных браузерах интерфейс отображается корректно, функционал поиска и корзины работает без ошибок

  - summary: |
      Проверка скорости загрузки страниц сайта
    requirement: |
      Сайт нужно разработать с учетом удобства использования и оптимизировать для скорости работы
    prerequisites:
      - Открыт браузер со стабильным интернет-соединением
    test-data: |
      Страницы = Главная страница, каталог товаров, карточка товара
    steps:
      - Открыть вкладку Network в инструментах разработчика (DevTools)
      - Перейти на каждую из страниц из тестовых данных и зафиксировать время полной загрузки (Load)
    expected-result: |
      Страницы загружаются быстро, интерфейс не зависает при скролле

  - summary: |
      Проверка защищенного соединения (HTTPS)
    requirement: |
      Сайт должен быть безопасным и защищать данные пользователя
    prerequisites:
      - Открыт браузер
    test-data: |
      URL = Адрес интернет-магазина
    steps:
      - Перейти по ссылке интернет-магазина
      - Проверить протокол в адресной строке браузера и статус SSL-сертификата
    expected-result: |
      Сайт открывается по защищенному протоколу HTTPS, браузер не выдает предупреждений о небезопасном соединении

  - summary: |
      Прямой доступ к сайту без использования VPN
    requirement: |
      Сайт должен быть доступен для пользователей без использования VPN
    prerequisites:
      - На устройстве отключены VPN-сервисы и прокси-серверы
    test-data: |
      URL = Адрес интернет-магазина
    steps:
      - Ввести адрес интернет-магазина в адресную строку браузера и нажать Enter
    expected-result: |
      Главная страница сайта успешно загружается без ошибок соединения или блокировок

  - summary: |
      Проверка полноты локализации контента (русский, английский и испанский языки)
    requirement: |
      Сайт должен иметь локализацию (перевод) на русский, английский и испанский языки
    prerequisites:
      - Открыта страница каталога интернет-магазина
    test-data: |
      Языки = Русский , Английский, Испанский
    steps:
      - Переключить язык интерфейса на английский и просмотреть главную страницу, карточку товара и корзину
      - Переключить язык интерфейса на испанский и просмотреть главную страницу, карточку товара и корзину
      - Переключить язык интерфейса на русский и просмотреть главную страницу, карточку товара и корзину
    expected-result: |
      На выбранном языке переведены все элементы интерфейса (кнопки, заголовки, уведомления), отсутствуют непереведенные куски текста или «кракозябры»
